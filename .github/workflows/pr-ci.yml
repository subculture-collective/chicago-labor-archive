name: PR CI

# Pull-request checks on GitHub-hosted runners. Main-branch builds and deploys
# stay in .gitea/workflows on Gitea Actions.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify with job-local pnpm
        run: |
          tool_dir=$(mktemp -d)
          trap 'rm -rf "$tool_dir"' EXIT
          npm install --prefix "$tool_dir" pnpm@10.33.0
          printf '%s\n' '@subcult:registry=https://git.subcult.tv/api/packages/subculture-collective/npm/' > "$tool_dir/npmrc"
          NPM_CONFIG_USERCONFIG="$tool_dir/npmrc" PATH="$tool_dir/node_modules/.bin:$PATH" make verify

  ci-gate:
    name: CI gate
    if: always()
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = {'verify'}
          assert set(results) == expected, results
          for name, result in results.items():
              assert result["result"] == "success", name + " did not pass"
          PY
