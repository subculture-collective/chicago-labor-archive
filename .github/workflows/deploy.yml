name: Deploy
run-name: Deploy ${{ github.sha }}

# Deploys main to Almaz. The job joins the tailnet as tag:github-ci (Tailscale
# OAuth client in the TS_OAUTH_* secrets), then uses this repository's deploy
# key, which Almaz accepts only from tailnet addresses and only for the
# chicago-labor-archive fleet-deploy receiver.
'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel a run that may be mid-deployment.
  cancel-in-progress: false

env:
  TARGET: onnwee@100.77.128.80
  DEPLOY_REVISION: ${{ github.sha }}
  IMAGE: ghcr.io/subculture-collective/chicago-labor-archive-web

jobs:
  deploy:
    name: Build, publish and deploy the frontend image
    if: github.repository == 'subculture-collective/chicago-labor-archive' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-ci
          version: latest
      - name: Prepare the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy/known_hosts"
      - name: Build deployable images from the verified revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          # The fleet-deploy receiver identifies the application by the Gitea source label.
          umask 077
          auth_dir=$(mktemp -d)
          trap 'rm -rf "$auth_dir"' EXIT
          printf '%s\n' '@subcult:registry=https://git.subcult.tv/api/packages/subculture-collective/npm/' > "$auth_dir/npmrc"
          DOCKER_BUILDKIT=1 docker build -f deploy/frontend.Dockerfile --build-arg CORE_UPSTREAM=core:8080 --secret id=npmrc,src="$auth_dir/npmrc" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/chicago-labor-archive" \
            -t "$IMAGE:$GITHUB_SHA" .
          docker run --rm --network none --entrypoint nginx "$IMAGE:$GITHUB_SHA" -t
          docker tag "$IMAGE:$GITHUB_SHA" "fleet-deploy/chicago-labor-archive/web:$GITHUB_SHA"
      - name: Publish the images to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          echo "published $(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")"
      - name: Deploy the built image and verify the live site
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          d="$RUNNER_TEMP/deploy"
          ssh_args=(-F /dev/null -i "$d/key" -o ControlPath=none -o ControlMaster=no -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" -o ConnectTimeout=15 "$TARGET")
          ssh "${ssh_args[@]}" status
          image="fleet-deploy/chicago-labor-archive/web:$DEPLOY_REVISION"
          # The receiver deploys only Gitea's current main. Kvant copies GitHub
          # to Gitea every minute, so wait while the revision has not arrived.
          for attempt in $(seq 1 20); do
            # shellcheck disable=SC2029
            if docker save "$image" | ssh "${ssh_args[@]}" "receive $DEPLOY_REVISION web" 2> "$d/err"; then break; fi
            if grep -q "no longer the current main" "$d/err" && [ "$attempt" -lt 20 ]; then
              echo "Gitea has not received $DEPLOY_REVISION yet; waiting 30 s ($attempt/20)"; sleep 30; continue
            fi
            cat "$d/err" >&2; exit 1
          done
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "deploy $DEPLOY_REVISION"
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "artifact $DEPLOY_REVISION web" > "$d/artifact.json"
          expected=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["html_sha256"])' "$d/artifact.json")
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            --max-time 30 https://cla.subcult.tv/ > "$d/live.html"
          actual=$(sha256sum "$d/live.html" | cut -d' ' -f1)
          test "$actual" = "$expected"
          printf 'Live HTML matches the image built from %s\n' "$DEPLOY_REVISION"
      - name: Remove the deploy key
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy"
